<!DOCTYPE html>
<html lang="fa" dir="rtl">

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#02050a;
    --bg2:#050b14;
    --card:#07111d;
    --card2:#0a1624;
    --blue:#008cff;
    --blue2:#00c8ff;
    --cyan:#00f0ff;
    --green:#00ff88;
    --text:#f3f8ff;
    --muted:#7890a8;
    --border:rgba(0,170,255,.22);
    --shadow:0 0 30px rgba(0,140,255,.12);
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% -10%,rgba(0,145,255,.22),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(0,90,255,.10),transparent 35%),

    color:var(--text);
    font-family:'Vazirmatn',Tahoma,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(0,140,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,140,255,.025) 1px,transparent 1px);
    background-size:35px 35px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

.header{
    position:sticky;
    top:0;
    z-index:20;
    padding:18px 16px 14px;
    background:rgba(2,5,10,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,174,255,.15);
}

.header-inner{
    max-width:760px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;

}

.logo span{
    color:var(--cyan);
}

.status{

    color:#6e8aa3;
    border:1px solid rgba(0,170,255,.18);
    padding:6px 10px;
    border-radius:20px;
}

.status b{
    color:var(--green);
}

main{
    width:min(760px,100%);

    padding:24px 15px 100px;
}

.hero{
    text-align:center;
    padding:28px 10px 25px;
}

.hero h1{
    margin:0;
    font-size:32px;
    font-weight:900;
    letter-spacing:-1px;
}

.hero h1 span{
    color:var(--blue2);
    text-shadow:0 0 20px rgba(0,190,255,.7);
}

.hero p{
    color:var(--muted);
    font-size:13px;
    margin:10px 0 0;
}

.sessions{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.session-btn{
    position:relative;
    overflow:hidden;
    border:1px solid var(--border);
    background:

    border-radius:22px;
    padding:21px;
    color:white;
    text-align:right;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:.25s;
}

.session-btn:active{
    transform:scale(.98);
}

.session-btn:before{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:var(--blue);
    filter:blur(70px);
    opacity:.12;
    left:-30px;
    top:-30px;
}

.session-top{

    align-items:center;
    justify-content:space-between;
}

.session-number{

    color:var(--cyan);

    letter-spacing:1px;
}

.session-icon{

}

.session-progress div{

.hidden{

.overall-line strong{

.overall-bar{

}

.overall-bar div{

.exercise.completed{

.set label span:first-child{

}

.set label span:last-child{
    font-size:13px;
    font-weight:800;
    color:#b6c9d8;
}

.set input:checked + label{
    background:rgba(0,255,135,.08);
    border-color:rgba(0,255,135,.55);
    box-shadow:0 0 15px rgba(0,255,135,.09);

.set input:checked + label span:first-child,
.set input:checked + label span:last-child{

}

.complete-message{
    display:none;
    margin-top:12px;
    padding:9px;

    color:var(--green);

    border:1px solid rgba(0,255,135,.15);
}

.exercise.completed .complete-message{

}

.finish{
    display:none;
    margin-top:20px;

    border-radius:22px;

.finish.show{
    display:block;

.finish-icon{

@keyframes pop{
    from{

        opacity:0;
    }
    to{

        opacity:1;
    }
}

@media(min-width:600px){

    .session-btn{

    }
}

let currentSession = 1;


/* =========================================================
   IMPORTANT:
   پاک شدن تیک‌ها با هر بار Refresh
========================================================= */

Object.keys(localStorage)
.filter(key => key.startsWith("neongym_"))
.forEach(key => {

    localStorage.removeItem(key);

});


/* =========================================================
   LOCAL STORAGE
========================================================= */

function getState(
    session,
    exerciseIndex
){

    const key =
        `neongym_${session}_${exerciseIndex}`;

    return JSON.parse(
        localStorage.getItem(key) || "[]"
    );
}


function saveState(
    session,
    exerciseIndex,
    state
){

    const key =
        `neongym_${session}_${exerciseIndex}`;

    localStorage.setItem(
        key,
        JSON.stringify(state)
    );
}


/* =========================================================
   GIF
========================================================= */

function createGifImage(ex){

    const img =
        document.createElement("img");

    img.src = ex.gif;

    img.alt = ex.name;

    img.loading = "lazy";

    img.onerror = function(){

        this.onerror = null;

        this.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`

        <svg xmlns="http://www.w3.org/2000/svg"
             width="800"
             height="450">

            <rect
                width="800"
                height="450"
                fill="#02070c"/>

            <circle
                cx="400"
                cy="220"
                r="85"
                fill="none"
                stroke="#00aaff"
                stroke-width="3">

                <animate
                    attributeName="r"
                    values="65;105;65"
                    dur="1.5s"
                    repeatCount="indefinite"/>

            </circle>

            <text
                x="400"
                y="215"
                text-anchor="middle"
                fill="#00d9ff"
                font-family="Arial"
                font-size="26"
                font-weight="bold">

                ${ex.name}

            </text>

            <text
                x="400"
                y="250"
                text-anchor="middle"
                fill="#55758d"
                font-family="Arial"
                font-size="14">

                GIF SOURCE UNAVAILABLE

            </text>

        </svg>

        `);
    };

    return img;
}

        button.onclick = ()=>{
            openSession(Number(id));
        };

        button.innerHTML = `

            <div class="session-top">

                <div class="session-number">
                    SESSION 0${id}
                </div>

                <div class="session-icon">
                    ${workout.icon}
                </div>

            </div>

            <div class="session-title">
                ${workout.title}
            </div>

            <div class="session-sub">
                ${workout.subtitle}
            </div>

            <div class="session-progress">

                <div
                    id="sessionProgress${id}">
                </div>

            </div>

        `;

        container.appendChild(button);

        updateSessionProgress(
            Number(id)
        );

    });
}


/* =========================================================
   OPEN SESSION
========================================================= */

function openSession(id){

    currentSession = id;

    document
    .getElementById("home")
    .classList.add("hidden");

    document
    .getElementById("workout")
    .classList.remove("hidden");

    document
    .getElementById("workoutTitle")
    .textContent =
        workouts[id].title;

    document
    .getElementById("workoutSubtitle")
    .textContent =
        workouts[id].subtitle;

    renderExercises();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   RENDER EXERCISES
========================================================= */

function renderExercises(){

    const container =
        document.getElementById(
            "exerciseList"
        );

    container.innerHTML = "";

    workouts[currentSession]
    .exercises
    .forEach((ex,index)=>{

        const saved =
            getState(
                currentSession,
                index
            );

        const card =
            document.createElement("div");

        card.className =
            "exercise";

        card.id =
            `exercise-${currentSession}-${index}`;


        const gif =
            createGifImage(ex);

        const gifWrap =
            document.createElement("div");

        gifWrap.className =
            "gif-wrap";

        gifWrap.appendChild(gif);

        gifWrap.innerHTML += `

            <div class="gif-overlay"></div>

            <div class="exercise-number">
                حرکت ${index+1}
            </div>

        `;

        card.appendChild(gifWrap);


        const info =
            document.createElement("div");

        info.className =
            "exercise-info";

        info.innerHTML = `

            <div class="exercise-title">
                ${ex.name}
            </div>

            <div class="exercise-meta">

                <div class="badge">
                    ${ex.equipment}
                </div>

                <div class="badge target">
                    ${ex.target}
                </div>

                <div class="badge">
                    ${ex.sets} ست
                </div>

                <div class="badge">
                    ${ex.reps}
                </div>

            </div>

            <div class="set-title">
                ست‌های انجام‌شده را تیک بزن
            </div>

            <div class="sets"></div>

            <div class="complete-message">
                ✓ حرکت کامل شد
            </div>

        `;

        card.appendChild(info);


        const sets =
            info.querySelector(".sets");


        for(
            let s=0;
            s<ex.sets;
            s++
        ){

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "set";

            const id =
                `s_${currentSession}_${index}_${s}`;

            const checked =
                saved.includes(s);

            wrapper.innerHTML = `

                <input
                    type="checkbox"
                    id="${id}"
                    ${checked ? "checked":""}
                >

                <label for="${id}">

                    <span>
                        ست ${s+1}
                    </span>

                    <span>
                        ${ex.reps}
                    </span>

                </label>

            `;


            const input =
                wrapper.querySelector(
                    "input"
                );

            input.addEventListener(
                "change",
                ()=>{
                    updateExercise(
                        index,
                        card
                    );
                }
            );


            sets.appendChild(wrapper);

        }


        container.appendChild(card);


        updateExercise(
            index,
            card
        );

    });


    updateOverall();

}


/* =========================================================
   UPDATE EXERCISE
========================================================= */

function updateExercise(
    index,
    card
){

    const inputs =
        card.querySelectorAll(
            'input[type="checkbox"]'
        );

    const completed = [];


    inputs.forEach(
        (input,i)=>{

            if(input.checked){

                completed.push(i);

            }

        }
    );


    saveState(
        currentSession,
        index,
        completed
    );


    const total =
        workouts[currentSession]
        .exercises[index]
        .sets;


    if(
        completed.length === total
    ){

        card.classList.add(
            "completed"
        );

    }else{

        card.classList.remove(
            "completed"
        );

    }


    updateOverall();

}


/* =========================================================
   OVERALL
========================================================= */

function updateOverall(){

    const exercises =
        workouts[currentSession]
        .exercises;

    let totalSets = 0;

    let doneSets = 0;


    exercises.forEach(
        (ex,index)=>{

            totalSets += ex.sets;

            doneSets +=
                getState(
                    currentSession,
                    index
                ).length;

        }
    );


    const percent =
        totalSets === 0
        ? 0
        : Math.round(
            doneSets /
            totalSets *
            100
        );


    document
    .getElementById(
        "overallBar"
    )
    .style.width =
        percent + "%";


    document
    .getElementById(
        "overallText"
    )
    .textContent =
        percent + "%";


    const finish =
        document.getElementById(
            "finish"
        );


    if(percent === 100){

        finish.classList.add(
            "show"
        );

    }else{

        finish.classList.remove(
            "show"
        );

    }


    updateSessionProgress(
        currentSession
    );

}


/* =========================================================
   SESSION PROGRESS
========================================================= */

function updateSessionProgress(id){

    const exercises =
        workouts[id].exercises;

    let total = 0;

    let done = 0;


    exercises.forEach(
        (ex,index)=>{

            total += ex.sets;

            done +=
                getState(
                    id,
                    index
                ).length;

        }
    );


    const percent =
        total
        ? Math.round(
            done /
            total *
            100
        )
        : 0;


    const bar =
        document.getElementById(
            `sessionProgress${id}`
        );


    if(bar){

        bar.style.width =
            percent + "%";

    }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    document
    .getElementById(
        "workout"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "home"
    )
    .classList.remove(
        "hidden"
    );


    renderHome();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   RESET CURRENT SESSION
========================================================= */

function resetCurrentSession(){

    const exercises =
        workouts[currentSession]
        .exercises;


    exercises.forEach(
        (ex,index)=>{

            localStorage.removeItem(
                `neongym_${currentSession}_${index}`
            );

        }
    );


    renderExercises();

}


/* =========================================================
   START
========================================================= */

renderHome();

</script>

</body>
</html>
