<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIZAD FIT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
    --bg:#02050a;
    --bg2:#050b14;
    --card:#07111d;
    --card2:#0a1624;
    --blue:#008cff;
    --blue2:#00c8ff;
    --cyan:#00f0ff;
    --green:#00ff88;
    --text:#f3f8ff;
    --muted:#7890a8;
    --border:rgba(0,170,255,.22);
    --shadow:0 0 30px rgba(0,140,255,.12);
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Vazirmatn,Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(0,140,255,.12),transparent 35%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(2,5,10,.88);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 15px rgba(0,200,255,.7);
}

.logo span{
    color:var(--cyan);
}

.online{
    display:flex;
    align-items:center;
    gap:7px;
    color:#8ba2b9;
    font-size:11px;
    font-weight:700;
}

.online-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

main{
    width:min(1100px,100%);
    margin:auto;
    padding:18px 12px 40px;
}

.hero{
    text-align:center;
    padding:25px 8px 20px;
}

.hero h1{
    margin:0;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow:
        0 0 10px rgba(0,140,255,.8),
        0 0 30px rgba(0,140,255,.25);
}

.hero h1 span{
    color:var(--cyan);
}

.hero p{
    margin:9px 0 0;
    color:var(--muted);
    font-size:12px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 3px 12px;
}

.section-title h2{
    margin:0;
    font-size:16px;
    font-weight:800;
}

.section-title span{
    color:var(--blue2);
    font-size:11px;
}

.sessions{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

.session-btn{
    position:relative;
    overflow:hidden;
    width:100%;
    min-height:118px;
    padding:18px;
    text-align:right;
    color:#fff;
    background:
        linear-gradient(145deg,rgba(0,140,255,.10),rgba(5,15,25,.92));
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    transition:.2s;
}

.session-btn:hover{
    border-color:rgba(0,200,255,.5);
    transform:translateY(-2px);
}

.session-btn:active{
    transform:scale(.99);
}

.session-number{
    color:var(--blue2);
    font-size:11px;
    font-weight:800;
    margin-bottom:7px;
}

.session-name{
    font-size:17px;
    font-weight:900;
}

.session-info{
    margin-top:7px;
    color:var(--muted);
    font-size:11px;
}

.progress{
    height:5px;
    margin-top:15px;
    overflow:hidden;
    background:#07101a;
    border-radius:10px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
    box-shadow:0 0 12px rgba(0,200,255,.55);
    transition:.25s;
}

.workout-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0 16px;
}

.back-btn{
    width:42px;
    height:42px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#06101b;
    color:#fff;
    font-size:20px;
}

.workout-title{
    flex:1;
}

.workout-title h2{
    margin:0;
    font-size:20px;
    font-weight:900;
}

.workout-title p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:11px;
}

.reset-btn{
    border:1px solid rgba(255,70,70,.25);
    background:rgba(255,40,40,.06);
    color:#ff7b7b;
    border-radius:11px;
    padding:9px 10px;
    font-size:10px;
    font-weight:700;
}

.session-progress{
    padding:13px 14px;
    margin-bottom:15px;
    background:rgba(7,17,29,.8);
    border:1px solid var(--border);
    border-radius:15px;
}

.session-progress-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:var(--muted);
    margin-bottom:8px;
}

.session-progress-top strong{
    color:var(--cyan);
}

.exercise-list{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.exercise-card{
    overflow:hidden;
    background:
        linear-gradient(145deg,rgba(8,22,36,.96),rgba(4,10,18,.98));
    border:1px solid var(--border);
    border-radius:19px;
    box-shadow:var(--shadow);
    transition:.25s;
}

.exercise-card.completed{
    border-color:rgba(0,255,136,.45);
    box-shadow:0 0 25px rgba(0,255,136,.08);
}

.gif-wrap{
    position:relative;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#03080e;
    border-bottom:1px solid rgba(0,170,255,.13);
}

.gif-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.gif-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(180deg,rgba(0,0,0,.08),transparent 45%,rgba(0,0,0,.3));
}

.exercise-number{
    position:absolute;
    top:10px;
    right:10px;
    min-width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:rgba(0,10,20,.82);
    border:1px solid rgba(0,200,255,.3);
    color:var(--cyan);
    font-size:11px;
    font-weight:900;
    backdrop-filter:blur(8px);
}

.exercise-body{
    padding:14px;
}

.exercise-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.exercise-title h3{
    margin:0;
    font-size:15px;
    font-weight:800;
}

.exercise-card.completed .exercise-title h3{
    color:var(--green);
}

.complete-text{
    display:none;
    color:var(--green);
    font-size:10px;
    font-weight:700;
}

.exercise-card.completed .complete-text{
    display:block;
}

.sets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.set{
    position:relative;
}

.set input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.set label{
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(0,150,255,.16);
    background:#06101a;
    border-radius:11px;
    color:#8ca2b8;
    font-size:10px;
    font-weight:700;
    transition:.2s;
}

.set input:checked + label{
    color:#00140b;
    background:var(--green);
    border-color:var(--green);
    box-shadow:0 0 15px rgba(0,255,136,.28);
}

.finish{
    display:none;
    margin-top:18px;
    padding:22px 16px;
    text-align:center;
    border:1px solid rgba(0,255,136,.35);
    border-radius:18px;
    background:rgba(0,255,136,.04);
}

.finish.show{
    display:block;
}

.finish strong{
    display:block;
    color:var(--green);
    font-size:19px;
}

.finish span{
    display:block;
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
}

.empty{
    padding:30px;
    text-align:center;
    color:var(--muted);
}

.hidden{
    display:none!important;
}

@media(min-width:600px){
    main{
        padding-left:18px;
        padding-right:18px;
    }

    .sessions{
        grid-template-columns:repeat(3,1fr);
    }

    .exercise-list{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        font-size:42px;
    }
}

@media(min-width:900px){
    .exercise-list{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
    <div class="logo">BIZAD<span>GYM</span></div>

    <div class="online">
        <span class="online-dot"></span>
        ONLINE
    </div>
</header>

<main>

    <section id="home">

        <div class="hero">
            <h1>BIZAD<span>GYM</span></h1>
            <p>تمرین هوشمند • پیگیری ست‌ها • پیشرفت واقعی</p>
        </div>

        <div class="section-title">
            <h2>جلسات تمرینی</h2>
            <span>۳ SESSION</span>
        </div>

        <div class="sessions" id="sessions"></div>

    </section>

    <section id="workout" class="hidden">

        <div class="workout-head">

            <button class="back-btn" onclick="goHome()">‹</button>

            <div class="workout-title">
                <h2 id="workoutName"></h2>
                <p id="workoutInfo"></p>
            </div>

            <button class="reset-btn" onclick="resetCurrentSession()">
                ریست
            </button>

        </div>

        <div class="session-progress">

            <div class="session-progress-top">
                <span>پیشرفت جلسه</span>
                <strong id="sessionPercent">0%</strong>
            </div>

            <div class="progress">
                <div class="progress-bar" id="sessionProgressBar"></div>
            </div>

        </div>

        <div class="exercise-list" id="exerciseList"></div>

        <div class="finish" id="finish">
            <strong>تمرین کامل شد</strong>
            <span>تمام ست‌های این جلسه را انجام دادی.</span>
        </div>

    </section>

</main>

</div>

let currentSession = 1;

/* با رفرش صفحه تمام تیک‌های قبلی پاک می‌شوند */
Object.keys(localStorage)
.filter(key => key.startsWith("neongym_"))
.forEach(key => {
    localStorage.removeItem(key);
});

function getState(session,exerciseIndex){
    const key = `neongym_${session}_${exerciseIndex}`;
    const saved = localStorage.getItem(key);

    if(!saved){
        return [];
    }

    try{
        return JSON.parse(saved);
    }catch{
        return [];
    }
}

function saveState(session,exerciseIndex,state){
    const key = `neongym_${session}_${exerciseIndex}`;
    localStorage.setItem(key,JSON.stringify(state));
}

function createGifImage(ex){

    if(ex.cardio){
        return `
            <div class="gif-wrap">
                <div style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    flex-direction:column;
                    gap:8px;
                    color:#00c8ff;
                    background:
                    radial-gradient(circle,rgba(0,140,255,.12),transparent 60%);
                ">
                    <div style="
                        font-size:42px;
                        line-height:1;
                        text-shadow:0 0 20px rgba(0,200,255,.7);
                    ">🏃</div>
                    <div style="
                        font-size:12px;
                        font-weight:800;
                        color:#7890a8;
                    ">تردمیل • ${ex.reps}</div>
                </div>
                <div class="gif-overlay"></div>
            </div>
        `;
    }

    return `
        <div class="gif-wrap">
            <img
                src="${ex.gif}"
                alt="${ex.name}"
                loading="lazy"
                onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                    <svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
                        <rect width="100%" height="100%" fill="#03080e"/>
                        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                              fill="#00c8ff" font-size="22" font-family="Arial">
                            GIF NOT AVAILABLE
                        </text>
                    </svg>
                `)}';"
            >
            <div class="gif-overlay"></div>
            <div class="exercise-number">${exerciseNumber(ex)}</div>
        </div>
    `;
}

function exerciseNumber(ex){
    const all = Object.values(workouts)
        .flatMap(w => w.exercises);

    return all.indexOf(ex) + 1;
}

function renderHome(){

    const container = document.getElementById("sessions");

    container.innerHTML = "";

    Object.entries(workouts).forEach(([id,workout])=>{

        const totalSets = workout.exercises.reduce(
            (sum,ex)=>sum + ex.sets,
            0
        );

        let doneSets = 0;

        workout.exercises.forEach((ex,index)=>{
            doneSets += getState(id,index).length;
        });

        const percent = totalSets
            ? Math.round((doneSets / totalSets) * 100)
            : 0;

        const button = document.createElement("button");

        button.className = "session-btn";

        button.innerHTML = `
            <div class="session-number">
                SESSION ${id}
            </div>

            <div class="session-name">
                ${workout.name}
            </div>

            <div class="session-info">
                ${workout.info} • ${workout.exercises.length} حرکت
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${percent}%"
                ></div>
            </div>
        `;

        button.onclick = ()=>openSession(Number(id));

        container.appendChild(button);
    });
}

function openSession(id){

    currentSession = id;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("workout").classList.remove("hidden");

    document.getElementById("workoutName").textContent =
        workouts[id].name;

    document.getElementById("workoutInfo").textContent =
        workouts[id].info;

    renderExercises();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function renderExercises(){

    const list = document.getElementById("exerciseList");

    list.innerHTML = "";

    const workout = workouts[currentSession];

    workout.exercises.forEach((ex,index)=>{

        const card = document.createElement("article");

        card.className = "exercise-card";

        const state = getState(currentSession,index);

        if(state.length === ex.sets){
            card.classList.add("completed");
        }

        const setsHTML = Array.from(
            {length:ex.sets},
            (_,setIndex)=>{

                const checked = state.includes(setIndex);

                return `
                    <div class="set">

                        <input
                            type="checkbox"
                            id="s_${currentSession}_${index}_${setIndex}"
                            ${checked ? "checked" : ""}
                        >

                        <label
                            for="s_${currentSession}_${index}_${setIndex}"
                        >
                            ست ${setIndex + 1}
                        </label>

                    </div>
                `;
            }
        ).join("");

        card.innerHTML = `
            ${createGifImage(ex)}

            <div class="exercise-body">

                <div class="exercise-title">

                    <h3>${ex.name}</h3>

                    <span class="complete-text">
                        کامل شد
                    </span>

                </div>

                <div style="
                    color:#7890a8;
                    font-size:10px;
                    margin-bottom:10px;
                ">
                    ${ex.sets} ست × ${ex.reps}
                </div>

                <div class="sets">
                    ${setsHTML}
                </div>

            </div>
        `;

        card.querySelectorAll('input[type="checkbox"]')
        .forEach((checkbox,setIndex)=>{

            checkbox.addEventListener("change",()=>{

                const state = getState(
                    currentSession,
                    index
                );

                if(checkbox.checked){

                    if(!state.includes(setIndex)){
                        state.push(setIndex);
                    }

                }else{

                    const position =
                        state.indexOf(setIndex);

                    if(position !== -1){
                        state.splice(position,1);
                    }
                }

                state.sort((a,b)=>a-b);

                saveState(
                    currentSession,
                    index,
                    state
                );

                updateExercise(
                    index,
                    card
                );

                updateOverall();
                updateSessionProgress(currentSession);
            });

        });

        list.appendChild(card);

    });

    updateOverall();
    updateSessionProgress(currentSession);
}

function updateExercise(index,card){

    const ex = workouts[currentSession].exercises[index];

    const state = getState(
        currentSession,
        index
    );

    if(state.length === ex.sets){
        card.classList.add("completed");
    }else{
        card.classList.remove("completed");
    }
}

function updateOverall(){

    const workout = workouts[currentSession];

    let totalSets = 0;
    let doneSets = 0;

    workout.exercises.forEach((ex,index)=>{

        totalSets += ex.sets;

        doneSets += getState(
            currentSession,
            index
        ).length;
    });

    const percent = totalSets
        ? Math.round((doneSets / totalSets) * 100)
        : 0;

    document.getElementById("sessionPercent")
        .textContent = `${percent}%`;

    document.getElementById("sessionProgressBar")
        .style.width = `${percent}%`;

    const finish =
        document.getElementById("finish");

    if(percent === 100){
        finish.classList.add("show");
    }else{
        finish.classList.remove("show");
    }
}

function updateSessionProgress(id){

    const workout = workouts[id];

    let totalSets = 0;
    let doneSets = 0;

    workout.exercises.forEach((ex,index)=>{

        totalSets += ex.sets;

        doneSets += getState(
            id,
            index
        ).length;
    });

    return totalSets
        ? Math.round((doneSets / totalSets) * 100)
        : 0;
}

function goHome(){

    document.getElementById("workout")
        .classList.add("hidden");

    document.getElementById("home")
        .classList.remove("hidden");

    renderHome();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function resetCurrentSession(){

    workouts[currentSession].exercises
    .forEach((_,index)=>{
        localStorage.removeItem(
            `neongym_${currentSession}_${index}`
        );
    });

    renderExercises();
}

renderHome();
</script>
